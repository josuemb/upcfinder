plugins {
    id 'groovy'
    id 'eclipse'
}

//Configuration
version = '0.0.2'
def mainClass = 'com.josuemb.upcfinder.xmlrpc.UPCFinder'
sourceCompatibility = '21'
targetCompatibility = '21'

//Default task
defaultTasks "showHelp"

//Source File Directory
def srcDir = file('src')

//Repositories for dependencies.
repositories {
    mavenCentral()
}

//Dependencies for this project
dependencies {
    implementation 'org.apache.groovy:groovy:5.1.0'
    implementation 'org.apache.groovy:groovy-json:5.1.0'
    implementation 'ch.qos.logback:logback-core:1.6.3'
    implementation 'ch.qos.logback:logback-classic:1.6.3'
    implementation 'org.slf4j:slf4j-api:2.0.18'

    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    // Gradle bundles an older junit-platform-launcher than the 5.14.x engine
    // expects; pin the matching launcher so the platform jars stay aligned
    // (otherwise: "OutputDirectoryCreator not available ... unaligned versions").
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

// Use JUnit Platform for tests
tasks.named('test') {
    useJUnitPlatform()
}

//Get the list for all files sended
String getManifestClassPath( Set runtimeLibFiles ) {
    return "$libsDirName/" + runtimeLibFiles.name.join( " $libsDirName/" );
}

//Contruct the executable jar file.
jar {
    manifest {
        attributes 'Implementation-Title': name,
                   'Implementation-Version': version,
                   'Implementation-Vendor-Id': 'josuemb@gmail.com',
                   'Main-Class': mainClass,
                   'Class-Path': getManifestClassPath(configurations.runtimeClasspath.resolve())
    }
}

//Show Help
tasks.register('showHelp') {
    description = 'Show help'
    doLast {
        println """\

Common tasks:
gradle zip - Generate zip distribution file.
gradle gzip - Generate tar.gzip distribution file.
gradle bz2 - Generate tar.bz2 distribution file.
gradle -q -t -all Print complete task list (with description).

"""
    }
}

//Generate zip distribution file
tasks.register('zip', Zip) {
    dependsOn 'clean', 'jar', 'javadoc', 'groovydoc'
    description = 'Generate zip distribution file.'
    //Put all files into a directory named as the project name and version.
    into("$project.name-$version"){
      from jar.archiveFile //Includes jar file
      from 'README' //Includes README file
      from 'build.gradle' //Includes build.gradle file
      //Put all dependency jar files into 'libs' directory
      into(libsDirName) {
          from configurations.runtimeClasspath //Includes all jar dependency files
      }
      //Put all generated documentation into 'docs' directory
      into(docsDir.name){
        from docsDir //Includes all docs
      }
      //Put all source files into 'src' directory
      into(srcDir.name){
        from srcDir //Includes all source files
      }
    }
}

//Generate tar.gz distribution file
tasks.register('gzip', Tar) {
    dependsOn 'clean', 'jar', 'javadoc', 'groovydoc'
    description = 'Generate tar.gz distribution file'
    compression = Compression.GZIP //Set compression mode
    archiveExtension = 'tar.gz' //Set extension for the destination file
    //Put all files into a directory named as the project name and version.
    into("$project.name-$version"){
      from jar.archiveFile //Includes jar file
      from 'README' //Includes README file
      from 'build.gradle' //Includes build.gradle file
      //Put all dependency jar files into 'libs' directory
      into(libsDirName) {
          from configurations.runtimeClasspath //Includes all jar dependency files
      }
      //Put all generated documentation into 'docs' directory
      into(docsDir.name){
        from docsDir //Includes all docs
      }
      //Put all source files into 'src' directory
      into(srcDir.name){
        from srcDir //Includes all source files
      }
    }
}

//Generate tar.bz2 distribution file
tasks.register('bz2', Tar) {
    dependsOn 'clean', 'jar', 'javadoc', 'groovydoc'
    description = 'Generate tar.bz2 distribution file'
    compression = Compression.BZIP2 //Set compression mode
    archiveExtension = 'tar.bz2' //Set extension for the destination file
    //Put all files into a directory named as the project name and version.
    into("$project.name-$version"){
      from jar.archiveFile //Includes jar file
      from 'README' //Includes README file
      from 'build.gradle' //Includes build.gradle file
      //Put all dependency jar files into 'libs' directory
      into(libsDirName) {
          from configurations.runtimeClasspath //Includes all jar dependency files
      }
      //Put all generated documentation into 'docs' directory
      into(docsDir.name){
        from docsDir //Includes all docs
      }
      //Put all source files into 'src' directory
      into(srcDir.name){
        from srcDir //Includes all source files
      }
    }
}
